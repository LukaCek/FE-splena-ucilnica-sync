# TrueNAS SCALE Custom App — FE Moodle Sync beta1.9.2
# Create the five writable FE target folders and secrets/state folders first.
# Do NOT paste Moodle cookies or passwords into this Compose/GitHub.
services:
  fe-moodle-sync:
    image: ghcr.io/lukacek/fe-splena-ucilnica-sync:beta1.9.1
    restart: unless-stopped
    command: ["python", "-m", "fe_sync", "loop"]
    environment:
      FE_ROOT: /data/FE
      SYNC_STATE_DIR: /state
      FE_MOODLE_SESSION_FILE: /run/secrets/moodle-session-cookies.json
      SYNC_INTERVAL_SECONDS: "7200"
      SYNC_DELAY_SECONDS: "0.3"
      SYNC_MAX_FILES: "2000"
      SYNC_MAX_FILE_MB: "100"
    volumes:
      # Read-only source: other FE notes and personal files can never be modified.
      - /mnt/tank/sync/FE:/data/FE:ro
      # Only these dedicated subfolders are writable by the container.
      - /mnt/tank/sync/FE/1-semester/01_MAT/Spletna-ucilnica:/data/FE/1-semester/01_MAT/Spletna-ucilnica:rw
      - /mnt/tank/sync/FE/1-semester/02_FIZ_MiT/Spletna-ucilnica:/data/FE/1-semester/02_FIZ_MiT/Spletna-ucilnica:rw
      - /mnt/tank/sync/FE/1-semester/03_PROG/Spletna-ucilnica:/data/FE/1-semester/03_PROG/Spletna-ucilnica:rw
      - /mnt/tank/sync/FE/1-semester/04_ELE/Spletna-ucilnica:/data/FE/1-semester/04_ELE/Spletna-ucilnica:rw
      - /mnt/tank/sync/FE/Spletna-ucilnica:/data/FE/Spletna-ucilnica:rw
      - /mnt/tank/apps/fe-moodle-sync/state:/state:rw
      - /mnt/tank/apps/fe-moodle-sync/secrets/moodle-session-cookies.json:/run/secrets/moodle-session-cookies.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time,datetime; from pathlib import Path; p=Path('/state/status.json'); j=json.loads(p.read_text()) if p.is_file() else {}; d=j.get('finished_at',''); age=time.time()-datetime.datetime.fromisoformat(d).timestamp() if d else 999999; assert j.get('status')=='ok' and age<18000"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 20m


  # Login browser: no ports are exposed on the TrueNAS host.
  fe-login-browser:
    image: selenium/standalone-chromium:4.48.0-20260905
    restart: unless-stopped
    shm_size: 1gb
    environment:
      SE_VNC_NO_PASSWORD: "true"
      SE_NODE_SESSION_TIMEOUT: "1800"
      SE_SCREEN_WIDTH: "1280"
      SE_SCREEN_HEIGHT: "900"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    networks: [login_internal]

  # Single private entry point: browser + noVNC only reachable through this
  # authenticated gateway. NEVER bind to 0.0.0.0 or a public IP.
  fe-login:
    image: ghcr.io/lukacek/fe-splena-ucilnica-sync:beta1.9.1
    restart: unless-stopped
    command: ["python", "-m", "fe_sync", "login"]
    depends_on:
      - fe-login-browser
    environment:
      FE_ROOT: /data/FE
      SYNC_STATE_DIR: /state
      FE_MOODLE_SESSION_FILE: /run/secrets/moodle-session-cookies.json
      FE_LOGIN_BASE_URL: "http://${FE_LOGIN_PRIVATE_IP:?Set a TrueNAS Tailscale IPv4 address}:17899"
      FE_LOGIN_WEBDRIVER: http://fe-login-browser:4444
      FE_LOGIN_NOVNC: http://fe-login-browser:7900
    ports:
      - "${FE_LOGIN_PRIVATE_IP:?Set a TrueNAS Tailscale IPv4 address}:17899:17899"
    volumes:
      - /mnt/tank/sync/FE:/data/FE:ro
      - /mnt/tank/sync/FE/Spletna-ucilnica:/data/FE/Spletna-ucilnica:rw
      - /mnt/tank/apps/fe-moodle-sync/state:/state:rw
      # Mutable original file inode required for Docker bind mount consistency.
      - /mnt/tank/apps/fe-moodle-sync/secrets/moodle-session-cookies.json:/run/secrets/moodle-session-cookies.json:rw
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
    networks: [login_internal]

networks:
  login_internal:
    driver: bridge
